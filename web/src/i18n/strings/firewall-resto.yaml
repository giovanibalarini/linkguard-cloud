# Área "firewall-resto": o que sobrou da tela de Firewall depois que postura,
# visão geral, modal de grupo, assistente e membros dos grupos do sistema
# ganharam dono próprio — a página com as abas e os snapshots, a tela de grupos
# de regras (índice + detalhe), o direcionamento por WAN, o encaminhamento de
# portas, o modal da regra, a pré-visualização da linha nft e a faixa do
# confirmar-ou-reverte.
#
# Prefixo obrigatório: fwx.*
#
# Termos que NÃO têm chave porque não se traduzem: palavras do nftables
# (accept, drop, reject, continue, forward, input, ct state new, jump, chain,
# ruleset, table inet linkguard), nomes de chain (mark_hosts), protocolos
# (tcp, udp, icmp), caminhos (/etc/nftables.conf), comandos
# (systemctl restart linkguard-cloud), nomes próprios (LinkGuard, WAN1, WAN2,
# docker, libvirt), siglas (SSH, DNS, DHCP, MAC, IP) e unidades (KB).

# ─── Página do Firewall / cabeçalho ─────────────────────────────────────────
fwx.title:
  pt: "Firewall"
  en: "Firewall"
fwx.subtitle:
  pt: "Gestão nativa via nftables (table inet linkguard)"
  en: "Native management through nftables (table inet linkguard)"
fwx.btn.refresh:
  pt: "Atualizar"
  en: "Refresh"

# ─── Faixa do confirmar-ou-reverte ──────────────────────────────────────────
fwx.revert.scope.head:
  pt: "A reversão desfaz apenas "
  en: "The revert only undoes "
fwx.revert.scope.strong:
  pt: "grupos e regras"
  en: "groups and rules"
fwx.revert.scope.tail:
  pt: ". Bloqueios por host, encaminhamentos de porta e o NTP não voltam atrás — o que você mudou neles durante a janela continua valendo."
  en: ". Host blocks, port forwards and NTP are not rolled back — whatever you changed in them during the window stays in effect."
fwx.confirm.btn.confirm:
  pt: "Confirmar acesso"
  en: "Confirm access"
fwx.confirm.btn.revert:
  pt: "Reverter agora"
  en: "Revert now"

# ─── Bloqueio por domínio (#123) ───────────────────────────────────────────
# Veio da tela de Links, que saiu com o multi-WAN. Só a capacidade de
# bloquear ficou; direcionar por WAN saiu junto.
fwx.domains.title:
  pt: "Bloqueio por domínio"
  en: "Domain blocking"
fwx.domains.subtitle:
  pt: "Aprende os endereços nas respostas do DNS desta máquina e bloqueia o tráfego para eles, com validade limitada."
  en: "Learns addresses from this machine's DNS answers and blocks traffic to them, for a limited time."
