# Nomes dos grupos do SISTEMA (issue #106).
#
# Estes dois grupos são criados pela migração com nome em português gravado no
# banco. A tela os traduz na EXIBIÇÃO, casando pelo `kind` — nunca pelo nome —,
# e o banco não é tocado.
#
# Por que não um UPDATE na migração: o nome está no banco de instalações que já
# existem, e reescrevê-lo por causa de uma troca de idioma seria o produto
# mexendo em dado do usuário. E por que é seguro traduzir só estes dois: eles
# são MANTIDOS pelo LinkGuard e o próprio painel diz que não podem ser
# renomeados — ou seja, o nome não é escolha de ninguém. Um grupo criado pelo
# admin nunca passa por aqui, porque não tem `kind`.
fwx.systemGroup.blocked_hosts:
  pt: "Hosts bloqueados"
  en: "Blocked hosts"
fwx.systemGroup.blocklist:
  pt: "Destinos bloqueados"
  en: "Blocked destinations"

