fwx.domains.notObservingHelp:
  pt: "O coletor de dnstap está desligado, então esta capacidade não recebe endereço nenhum: os domínios ativos não bloqueiam nada, e os zeros de rotatividade e último acesso abaixo NÃO querem dizer que ninguém acessou. Ligue o dnstap na tela de DNS."
  en: "The dnstap collector is off, so this capability receives no addresses at all: active domains block nothing, and the zeros for rotation and last seen below do NOT mean nobody visited. Turn dnstap on in the DNS screen."
