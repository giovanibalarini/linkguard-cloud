  en: "No domain target configured."
fwx.domains.caveat.title:
  pt: "Limites que afetam o resultado"
  en: "Limits that affect the result"
fwx.domains.caveat.cdn:
  pt: "CDN: um domínio pode dividir IP com outros serviços; bloquear esse IP pode afetá-los até a validade expirar. Use o ensaio e confira a rotação."
  en: "CDN: a domain may share an IP with other services; blocking that IP can affect them until it expires. Use trial mode and inspect rotation."
fwx.domains.caveat.encryptedDns:
  pt: "DoH/DoT: só as respostas do resolvedor desta máquina são aprendidas. Quem usa DNS cifrado próprio não é coberto."
  en: "DoH/DoT: only answers from this machine's resolver are learned. Clients using their own encrypted DNS are not covered."
fwx.domains.caveat.vpn:
  pt: "VCN: o DNS desta máquina atende quem está na VPN. As máquinas da VCN usam o resolvedor da Oracle, então para elas o bloqueio só vale para endereços que alguém da VPN já tenha resolvido."
  en: "VCN: this machine's DNS serves VPN users. VCN machines use Oracle's resolver, so for them blocking only covers addresses someone on the VPN has already resolved."
fwx.domains.caveat.fixedIp:
  pt: "IP fixo ou acesso direto: sem uma resposta DNS observada não há aprendizado; use uma regra explícita de IP/CIDR."
  en: "Fixed IP or direct access: without an observed DNS response nothing is learned; use an explicit IP/CIDR rule."
fwx.domains.caveat.ipv6:
  pt: "IPv6: o bloqueio aprende IPv4 e IPv6."
  en: "IPv6: blocking learns both IPv4 and IPv6."
