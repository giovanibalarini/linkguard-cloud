# `owner.label`; a tela traduz a partir do KEY e usa o label só quando não há
# chave. O label continua vindo em português do Go de propósito: ele é o que
# aparece em log, auditoria e resposta de API, onde não existe idioma de
# sessão — e mudá-lo lá quebraria quem consome a API.
