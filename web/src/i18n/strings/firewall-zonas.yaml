  en: "Allow traffic on local loopback interface (lo)"
fw.implicita.nd:
  pt: "Permitir descoberta de vizinhos IPv6 (Neighbor Discovery)"
  en: "Allow IPv6 Neighbor Discovery"
fw.implicita.dhcp:
  pt: "Permitir cliente DHCP IPv4"
  en: "Allow IPv4 DHCP client"
fw.implicita.dhcp6:
  pt: "Permitir cliente DHCPv6"
  en: "Allow IPv6 DHCP client"

fw.travada.hosts_bloqueados:
  pt: "Bloquear tráfego de máquinas bloqueadas"
  en: "Block traffic from blocked hosts"
fw.travada.destinos_bloqueados:
  pt: "Bloquear tráfego para destinos bloqueados"
  en: "Block traffic to blocked destinations"
fw.travada.ping:
  pt: "Permitir ping (ICMP echo request)"
  en: "Allow ping (ICMP echo request)"
fw.travada.contencao:
  pt: "Contenção de borda: bloquear tráfego para sub-redes privadas na saída"
  en: "Border containment: block outbound traffic to private subnets"
fw.travada.wireguard:
  pt: "Permitir túnel WireGuard na porta externa"
  en: "Allow WireGuard tunnel on external port"
fw.travada.nat:
  pt: "Encaminhamento de porta: {nome}"
  en: "Port forward: {nome}"
fw.travada.antibloqueio_vcn:
  pt: "Anti-bloqueio: garantir acesso à gerência pela VCN"
  en: "Anti-lockout: ensure management access from VCN"
fw.travada.antibloqueio_vpn:
  pt: "Anti-bloqueio: garantir acesso à gerência pela VPN"
  en: "Anti-lockout: ensure management access from VPN"
fw.travada.dns_vpn:
  pt: "Permitir acesso ao servidor DNS local para clientes VPN"
  en: "Allow VPN clients access to local DNS server"
fw.travada.vpn_total:
  pt: "Acesso total à rede para {pessoa}"
  en: "Full network access for {pessoa}"
fw.travada.vpn_restrito:
  pt: "Acesso restrito para {pessoa}"
  en: "Restricted access for {pessoa}"

fw.padrao.internet_in:
  pt: "Bloquear todo o tráfego não explicitamente liberado da Internet para o firewall"
  en: "Block all unallowed incoming traffic from Internet to firewall"
fw.padrao.internet_fwd:
  pt: "Bloquear todo o tráfego de passagem vindo da Internet"
  en: "Block all forwarding traffic coming from Internet"
fw.padrao.vcn_in:
  pt: "Bloquear tráfego da VCN para o firewall (exceto regras liberadas)"
  en: "Block VCN traffic to firewall (except allowed rules)"
fw.padrao.vcn_fwd:
  pt: "Liberar tráfego da VCN de passagem para a Internet"
  en: "Allow VCN forwarding traffic to Internet"
fw.padrao.vpn_in:
  pt: "Bloquear tráfego de clientes VPN para o firewall (exceto regras liberadas)"
  en: "Block VPN client traffic to firewall (except allowed rules)"
fw.padrao.vpn_fwd:
  pt: "Bloquear tráfego de clientes VPN não liberado pelos perfis"
  en: "Block VPN client forwarding traffic not allowed by profiles"
