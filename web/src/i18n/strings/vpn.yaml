  pt: "Quem acessa a rede da nuvem de fora, e até onde."
  en: "Who reaches the cloud network from outside, and how far."
vpn.subtitleMine:
  pt: "Seu acesso à rede da nuvem."
  en: "Your access to the cloud network."
vpn.refresh:
  pt: "Atualizar"
  en: "Refresh"
vpn.saved:
  pt: "Configuração do servidor VPN salva e aplicada."
  en: "VPN server configuration saved and applied."
vpn.lastApplyFailed:
