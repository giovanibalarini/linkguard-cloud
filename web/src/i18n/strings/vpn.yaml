# Dar acesso a alguém (admin).
vpn.give.open:
  pt: "Dar acesso a alguém"
  en: "Give someone access"
vpn.give.title:
  pt: "Dar acesso à VPN"
  en: "Give VPN access"
vpn.give.who:
  pt: "Para quem"
  en: "For whom"
vpn.give.pickUser:
  pt: "Escolha a pessoa"
  en: "Choose the person"
vpn.give.noCandidates:
  pt: "Todos os usuários já têm VPN. Crie o usuário em Administração primeiro."
  en: "Every user already has a VPN. Create the user under Administration first."
vpn.give.roleHint:
  pt: "Para quem só vai usar a VPN, crie o usuário com o papel \"Usuário VPN\": ele vê só a própria VPN no painel."
  en: "For someone who will only use the VPN, create the user with the \"Usuário VPN\" role: they see only their own VPN in the panel."
vpn.give.submit:
  pt: "Gerar acesso"
  en: "Generate access"

# Editar o acesso de alguém (admin).
vpn.edit.title:
  pt: "Acesso de {user}"
  en: "{user}'s access"
vpn.edit.note:
  pt: "A mudança vale no firewall na hora. No aparelho da pessoa, só depois que ela receber a configuração nova."
  en: "The change applies to the firewall immediately. On the person's device, only after they get the new configuration."
vpn.edit.submit:
  pt: "Salvar acesso"
  en: "Save access"
vpn.edit.saved:
  pt: "Acesso de {user} salvo. Use \"Entregar configuração\" para mandar o arquivo novo."
  en: "{user}'s access saved. Use \"Deliver configuration\" to send the new file."

# Perfil de acesso.
vpn.access.question:
  pt: "Até onde essa pessoa vai?"
  en: "How far does this person go?"
vpn.access.restricted:
  pt: "Só destinos escolhidos"
  en: "Chosen destinations only"
vpn.access.restrictedDesc:
  pt: "Alcança apenas os aliases de endereços e as portas abaixo. O resto da internet dela não passa pela nuvem."
  en: "Reaches only the address aliases and ports below. The rest of their internet does not go through the cloud."
vpn.access.full:
  pt: "Acesso completo"
  en: "Full access"
vpn.access.fullDesc:
  pt: "Alcança toda a rede da nuvem, e a internet inteira dela passa pelo gateway."
  en: "Reaches the whole cloud network, and all of their internet goes through the gateway."
vpn.access.groups:
  pt: "Aliases de endereços liberados"
  en: "Allowed address aliases"
vpn.access.noGroups:
  pt: "Nenhum alias de endereços cadastrado. Crie um em Firewall › Aliases."
  en: "No address aliases yet. Create one under Firewall › Aliases."
vpn.access.noGroupChosen:
  pt: "Sem nenhum alias marcado a pessoa conecta, mas não alcança nada."
  en: "With no alias checked the person connects but reaches nothing."
vpn.access.ports:
  pt: "Portas (opcional)"
  en: "Ports (optional)"
vpn.access.portsHelp:
  pt: "Separe por vírgula; faixas como 8000-8100 valem. Vazio libera todas as portas desses hosts."
  en: "Comma separated; ranges like 8000-8100 are fine. Empty allows every port on those hosts."
vpn.access.advanced:
  pt: "Avançado"
  en: "Advanced"
vpn.access.tunnel:
  pt: "O que passa pelo túnel"
  en: "What goes through the tunnel"
vpn.access.tunnelSplit:
  pt: "Só o tráfego para a rede da nuvem (túnel parcial)"
  en: "Only traffic to the cloud network (split tunnel)"
vpn.access.tunnelFull:
  pt: "Toda a internet da pessoa"
  en: "All of the person's internet"
vpn.access.routes:
  pt: "Rotas a mais no túnel"
  en: "Extra routes in the tunnel"
vpn.access.routesHelp:
  pt: "Redes que também devem passar pela VPN, como 192.168.50.0/24. Os aliases liberados já entram sozinhos."
  en: "Networks that should also go through the VPN, like 192.168.50.0/24. Allowed aliases are added automatically."
vpn.access.mtu:
  pt: "MTU do túnel (opcional)"
  en: "Tunnel MTU (optional)"
vpn.access.mtuHelp:
  pt: "Só mexa se a conexão travar em páginas ou transferências grandes. Vazio usa o padrão do WireGuard."
  en: "Only change it if the connection stalls on large pages or transfers. Empty uses the WireGuard default."

