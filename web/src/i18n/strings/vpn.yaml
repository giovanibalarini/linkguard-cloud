vpn.me.hint:
  pt: "Baixar de novo não troca a chave: serve para outro aparelho ou se você perdeu o arquivo. Troque a chave só se suspeitar de vazamento."
  en: "Downloading again does not change the key: use it for another device or if you lost the file. Change the key only if you suspect a leak."

