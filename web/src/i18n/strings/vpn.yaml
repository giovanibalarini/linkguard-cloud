  en: "QR code unavailable: use the file."
vpn.delivery.download:
  pt: "Baixar .conf"
  en: "Download .conf"
vpn.delivery.copy:
  pt: "Copiar"
  en: "Copy"
vpn.delivery.close:
  pt: "Fechar"
  en: "Close"
vpn.delivery.copied:
  pt: "Configuração copiada."
  en: "Configuration copied."
vpn.delivery.copyFailed:
  pt: "O navegador recusou a cópia; selecione o texto e copie à mão."
  en: "The browser refused to copy; select the text and copy it by hand."
vpn.delivery.mineNote:
  pt: "No celular, escaneie o QR code no app WireGuard. No computador, importe o arquivo .conf."
  en: "On a phone, scan the QR code in the WireGuard app. On a computer, import the .conf file."
vpn.delivery.forNote:
  pt: "Entregue a {user} por um canal seguro. Depois, {user} pode trocar a chave em Minha VPN e ficar com uma que nem você viu."
  en: "Deliver it to {user} through a safe channel. Later, {user} can change the key under My VPN and keep one not even you have seen."

