# Área "rede": Rotas, Interfaces e Tráfego por
# interface. Todas as chaves começam com `net.` (ver scripts/gen-i18n.mjs:
# chave repetida entre áreas é erro de build, não "o último ganha").
#
# NÃO traduzido de propósito, aqui e nos componentes: nomes de interface
# (eth0, enp3s0, lo), keywords de ip route/ip rule (default, all, main),
# siglas (RRD, MAC, CIDR, DHCP, WAN, LAN, RX, TX, FWMark), unidades
# (B/KB/MB/GB, 5m/30m/12h/30d/1y/5y) e caminhos (/proc). São o que o admin
# digita e o que ele acha no sistema.

# ─── Mensagens e rótulos compartilhados na área ─────────────────────────────
