# Fonte ÚNICA dos textos da interface (issue #105).
#
# Regra: texto que a pessoa lê na tela nasce AQUI, nos dois idiomas, e o
# componente referencia a chave. Nunca o contrário.
#
# `npm run i18n:gen` transforma este arquivo em src/i18n/strings.generated.ts.
# Chave sem tradução em algum idioma quebra o build — de propósito: é o que
# impede texto novo de nascer só em português, que é como a tradução tinha
# parado em 3 de 70 telas.
#
# Marcadores {assim} são substituídos em runtime: t('chave', {n: 3}).

