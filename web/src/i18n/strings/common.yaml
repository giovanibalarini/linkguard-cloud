# Faixa do confirmar-ou-reverte — a rede de segurança. O texto aqui é o que
# impede o operador de se trancar fora, então cada frase é traduzida inteira,
# nunca montada por concatenação.
fw.confirm.countdown:
  pt: "reverte em"
  en: "reverts in"
fw.confirm.title:
  pt: "Esta alteração mexe no tráfego destinado ao próprio firewall e aguarda confirmação."
  en: "This change affects traffic addressed to the firewall itself and is awaiting confirmation."
fw.confirm.appliedBy:
  pt: " · aplicada por "
  en: " · applied by "
fw.confirm.unknownUser:
  pt: "desconhecido"
  en: "unknown"
fw.confirm.testAccess:
  pt: "Teste o acesso que importa — SSH, este painel — antes de confirmar. Se ficou de fora, não faça nada:"
  en: "Test the access that matters — SSH, this panel — before confirming. If you got locked out, do nothing:"
fw.confirm.deadlinePassed:
  pt: "o prazo acabou e a reversão automática está a caminho."
  en: "the deadline has passed and the automatic revert is on its way."
fw.confirm.deadlineRunning:
  pt: "o LinkGuard reverte sozinho quando o prazo acabar."
  en: "LinkGuard reverts by itself when the deadline runs out."
fw.confirm.needWrite:
  pt: "Confirmar e reverter exigem permissão de escrita no firewall. Chame quem tem — ou espere o prazo, que reverte sozinho."
  en: "Confirming and reverting require firewall write permission. Call someone who has it — or wait for the deadline, which reverts on its own."
fw.confirm.staleRead:
  pt: "O painel não conseguiu reler o estado desta janela agora — o que está acima é a última leitura boa. Continua tentando."
  en: "The panel could not re-read this window's state just now — what you see above is the last good reading. It keeps trying."
fw.confirm.reverting.title:
  pt: "A reversão está em curso — e você já pode editar normalmente."
  en: "The revert is under way — and you can already edit normally."
fw.confirm.reverting.body:
  pt: "A configuração do firewall já voltou ao estado anterior aqui no LinkGuard; falta o firewall aceitar a reconfiguração, e ele repete a tentativa até conseguir. Não há o que confirmar: esta alteração não vai mais valer."
  en: "The firewall configuration is already back to its previous state here in LinkGuard; what remains is for the firewall to accept the reconfiguration, and it retries until it succeeds. There is nothing to confirm: this change will no longer take effect."
fw.confirm.reverting.editable:
  pt: "A edição continua liberada: se foi uma regra que fez o firewall recusar, é editando ou apagando ela que você resolve — a sua próxima alteração aplica os dois estados de uma vez."
  en: "Editing stays unlocked: if a rule is what made the firewall refuse, editing or deleting it is how you fix this — your next change applies both states at once."
fw.confirm.reverting.scope:
  pt: "A reversão devolve regras, aliases, agendamentos, NAT, ajustes e os perfis de acesso da VPN. Bloqueios de máquina e a lista de destinos bloqueados não fazem parte dela e continuam como estão."
  en: "The revert restores rules, aliases, schedules, NAT, settings and the VPN access profiles. Host blocks and the blocked destinations list are not part of it and stay as they are."
fw.confirm.unknown.title:
  pt: "Não foi possível saber se há alguma alteração aguardando confirmação."
  en: "It was not possible to tell whether any change is awaiting confirmation."
fw.confirm.unknown.body:
  pt: "A consulta ao LinkGuard falhou. Isto não quer dizer que não há nada pendente — quer dizer que não sabemos. Se você acabou de aplicar uma alteração de escopo input, ela pode estar contando os 90 segundos agora."
  en: "The query to LinkGuard failed. This does not mean nothing is pending — it means we do not know. If you have just applied an input-scoped change, it may be counting down its 90 seconds right now."
fw.confirm.retry:
  pt: "Tentar de novo"
  en: "Try again"


