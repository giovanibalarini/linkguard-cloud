svc.hosts.quota.cycleDayHint:
  pt: "De 1 a 28 — todo mês tem dia 28, e um fechamento em 29, 30 ou 31 não existiria em fevereiro. No período diário o ciclo vira à meia-noite e este campo não vale."
  en: "From 1 to 28 — every month has a 28th, and a cycle day of 29, 30 or 31 would not exist in February. On the daily period the cycle turns at midnight and this field does not apply."
svc.hosts.quota.removeHint:
  pt: "Remover a cota não apaga o consumo já medido: o número continua na tela, só deixa de ter teto."
  en: "Removing the cap does not erase measured usage: the number stays on screen, it just no longer has a ceiling."
