# ─── Fuga de DNS (issue #124) ─────────────────────────────────────────────────
# O aviso não é disclaimer jurídico: é o que impede a tela de vender como
# controle o que é apenas redução de contorno. Sem ele, a feature vira a mesma
# confiança falsa que existe para corrigir.

# ─── Mapa endereço → nome (issue #116) ───────────────────────────────────────
# O log de consultas guarda o que foi PERGUNTADO; isto guarda o que foi
# RESPONDIDO. Sem a resposta, todo destino do produto é número — o registro de
# fluxo mostraria 142.250.x.x e ninguém consegue ler a própria rede.
svc.dns.check.dnstap:
  pt: "Guardar as respostas para identificar destinos por nome"
  en: "Keep answers so destinations can be identified by name"
svc.dns.hint.dnstap:
  pt: "Sem isto, o firewall sabe que alguém perguntou por um site e não sabe qual endereço foi devolvido — então toda tela mostra o destino como número. As respostas saem por um canal binário, mais barato que o registro de consultas, e ficam só na memória: o mapa se esvazia ao reiniciar e cada endereço é esquecido quando o prazo do próprio DNS vence."
  en: "Without this, the firewall knows someone asked for a site but not which address came back — so every screen shows destinations as numbers. Answers travel over a binary channel, cheaper than the query log, and stay in memory only: the map empties on restart and each address is forgotten when its own DNS lifetime expires."

# ─── Registro de conversa por host (issue #115) ──────────────────────────────
# O que a tela mostra é COM QUEM cada aparelho falou. Duas coisas são
# obrigatórias no texto e não são enfeite: (1) que a janela é rolante e curta, e
# (2) as quatro coisas que a medição NÃO sabe. Sem isso, o admin lê uma lista
# parcial como se fosse o registro completo do que aconteceu na rede.
svc.fluxos.title:
  pt: "Com quem este aparelho falou"
  en: "Who this device talked to"
svc.fluxos.window:
  pt: "Conversas ativas nos últimos {min} min, mantidas na memória do kernel. A janela diz quem falou — não é o período do volume."
  en: "Conversations active in the last {min} min, kept in kernel memory. The window says who talked — it is not the period the volume covers."
svc.fluxos.readAt:
  pt: "Lido do kernel às {hora}."
  en: "Read from the kernel at {hora}."
svc.fluxos.refresh:
  pt: "Atualizar"
  en: "Refresh"
svc.fluxos.loading:
  pt: "Lendo a medição…"
  en: "Reading the measurement…"
svc.fluxos.error:
  pt: "Não consegui ler a medição. Isto não quer dizer que o aparelho não falou com ninguém — quer dizer que não sei."
  en: "Could not read the measurement. This does not mean the device talked to nobody — it means I do not know."
svc.fluxos.empty:
  pt: "Nenhuma conversa registrada nesta janela."
  en: "No conversation recorded in this window."
svc.fluxos.col.destination:
  pt: "Destino"
  en: "Destination"
svc.fluxos.col.port:
  pt: "Porta"
  en: "Port"
svc.fluxos.col.volume:
  pt: "Volume"
  en: "Volume"
svc.fluxos.count:
  pt: "Mostrando {shown} de {total} conversas (cada linha é um destino em uma porta; o mesmo destino em três portas são três linhas)."
  en: "Showing {shown} of {total} conversations (each row is one destination on one port; the same destination on three ports is three rows)."
svc.fluxos.total:
  pt: "Total da janela: {bytes}, somando as {total} conversas — inclusive as que não couberam na lista acima."
  en: "Window total: {bytes} across all {total} conversations — including the ones that did not fit in the list above."
svc.fluxos.full:
  pt: "Medição cheia agora: o teto de {teto} conversas está batido. Com o teto cheio o kernel recusa a conversa NOVA — o que falta desta lista é o mais recente, não o menos importante, mesmo a lista estando ordenada por volume."
  en: "Measurement full right now: the ceiling of {teto} conversations is reached. When it is full the kernel refuses the NEW conversation — what is missing from this list is the most recent, not the least important, even though the list is sorted by volume."
svc.fluxos.wasFull:
  pt: "A medição encheu em algum momento desta janela: houve conversa que não coube. Ela pode não estar cheia agora — as conversas vencem e abrem espaço — e ainda assim faltar coisa aqui."
  en: "The measurement filled up at some point in this window: some conversations did not fit. It may not be full right now — entries expire and free space — and things can still be missing here."
svc.fluxos.nearFull:
  pt: "Medição em {pct}% do teto ({ocupacao} de {teto}). Perto do teto, conversa nova começa a ser recusada em rajada: esta lista pode estar incompleta."
  en: "Measurement at {pct}% of the ceiling ({ocupacao} of {teto}). Near the ceiling, new conversations start being refused in bursts: this list may be incomplete."
svc.fluxos.notMounted:
  pt: "O registro está ligado, mas a medição não está montada no kernel — isto NÃO quer dizer que ninguém falou. Costuma acontecer depois de uma atualização do pacote nftables, que limpa o que está valendo. Tentei remontar sozinho e não consegui; salvar a configuração de novo, ou reiniciar o serviço, recria a medição."
  en: "The record is on, but the measurement is not mounted in the kernel — this does NOT mean nobody talked. It usually happens after an nftables package upgrade, which clears the live ruleset. I tried to remount it and could not; saving the settings again, or restarting the service, recreates it."
svc.fluxos.names.off:
  pt: "O mapa de nomes está desligado, então o destino aparece como endereço. Ligue-o em Serviços de rede para ver o nome do site."
  en: "The name map is off, so destinations show as addresses. Turn it on under network services to see site names."
svc.fluxos.names.full:
  pt: "O mapa de nomes já encheu e descartou os endereços mais antigos: um destino sem nome aqui pode ter sido consultado e ter saído do mapa para caber outro."
  en: "The name map filled up and dropped its oldest addresses: a destination with no name here may have been looked up and evicted to make room for another."
svc.fluxos.limits.title:
  pt: "O que esta medição não sabe"
  en: "What this measurement does not know"
svc.fluxos.limits.duration:
  pt: "Quanto tempo cada conversa durou."
  en: "How long each conversation lasted."
svc.fluxos.limits.volume:
  pt: "O volume é o acumulado da conversa DESDE QUE ELA COMEÇOU, não o da janela: uma conversa que nunca fica quieta não vence, e o número dela cresce além dos minutos anunciados acima. Como a lista é ordenada por volume, as conversas sempre ligadas (VoIP, VPN, backup) sobem acima das que de fato pesaram na última janela."
  en: "The volume is what the conversation has accumulated SINCE IT STARTED, not within the window: a conversation that never goes quiet never expires, and its number grows past the minutes announced above. Because the list is sorted by volume, always-on conversations (VoIP, VPN, backup) rank above the ones that actually weighed in the last window."
svc.fluxos.limits.wan:
  pt: "Por qual link a conversa saiu."
  en: "Which link the conversation went out through."
svc.fluxos.limits.lanlan:
  pt: "Conversa entre dois aparelhos da própria LAN aparece duas vezes, uma de cada lado — não há como saber qual dos dois começou sem seguir a conexão."
  en: "A conversation between two devices on the LAN itself shows up twice, once from each side — there is no way to tell which of the two started it without tracking the connection."
svc.fluxos.limits.naming:
  pt: "O nome do destino é o último domínio que a REDE INTEIRA resolveu para aquele endereço, não necessariamente o que este aparelho pediu: um endereço de CDN atende vários sites."
  en: "The destination name is the last domain the WHOLE NETWORK resolved to that address, not necessarily what this device asked for: one CDN address serves many sites."
svc.fluxos.limits.family:
  pt: "Conversa em IPv6 e tráfego que não seja TCP ou UDP (ping, por exemplo) não entram."
  en: "IPv6 conversations and non-TCP/UDP traffic (ping, for instance) are not counted."
svc.fluxos.limits.reboot:
  pt: "Nada disto sobrevive a um reinício da caixa: a janela recomeça vazia."
  en: "None of this survives a reboot: the window starts empty again."
svc.fluxos.off.title:
  pt: "Registro de conversa desligado"
  en: "Conversation record is off"
svc.fluxos.off.body:
  pt: "Enquanto estiver desligado, a caixa não guarda com quem os aparelhos falaram. Ligar acrescenta uma medição no caminho de todo o tráfego da rede e passa a registrar os destinos de cada aparelho — numa empresa, isso é o histórico de navegação de quem usa a rede. É uma decisão de quem administra a caixa, não um padrão."
  en: "While off, the box keeps no record of who the devices talked to. Turning it on adds a measurement in the path of all network traffic and starts recording each device's destinations — in a company, that is the browsing history of whoever uses the network. It is a decision for whoever administers the box, not a default."
svc.fluxos.off.noPermission:
  pt: "Peça a um administrador para ligar o registro de conversa."
  en: "Ask an administrator to turn the conversation record on."
svc.fluxos.config.title:
  pt: "Registro de conversa"
  en: "Conversation record"
svc.fluxos.config.window:
  pt: "Guardar por (minutos)"
  en: "Keep for (minutes)"
svc.fluxos.config.windowHint:
  pt: "Entre {min} e {max} minutos. Quanto maior, mais tempo os destinos de cada aparelho ficam legíveis para quem tiver permissão."
  en: "Between {min} and {max} minutes. The longer it is, the longer each device's destinations stay readable to anyone with permission."
svc.fluxos.config.ceiling:
  pt: "Teto de conversas"
  en: "Conversation ceiling"
svc.fluxos.config.ceilingHint:
  pt: "Entre {min} e {max}. É memória do kernel (~100 B por conversa). O que conta para o teto é destino × porta, não aparelho: um só navegador abre dezenas de destinos por site. Acima do teto, conversa NOVA não entra e a tela avisa."
  en: "Between {min} and {max}. This is kernel memory (~100 B per conversation). What counts toward the ceiling is destination × port, not device: a single browser opens dozens of destinations per site. Past the ceiling, NEW conversations are refused and the screen says so."
svc.fluxos.config.resetWarning:
  pt: "Salvar zera a janela atual. Trocar o prazo exige recriar a medição, e não há como manter o que já foi registrado."
  en: "Saving clears the current window. Changing the retention requires recreating the measurement, and there is no way to keep what was already recorded."
svc.fluxos.config.enable:
  pt: "Ligar registro"
  en: "Turn record on"
svc.fluxos.config.disable:
  pt: "Desligar e apagar"
  en: "Turn off and erase"
svc.fluxos.config.saveError:
  pt: "Não consegui salvar a configuração do registro de conversa."
  en: "Could not save the conversation record settings."
# ─── Cota de dados por aparelho (issue #126) ─────────────────────────────────
# As DUAS frases de honestidade desta tela são obrigatórias, e não decoração:
# sem "só IPv4" o número subconta em silêncio, e sem "avisa, não corta" a tela
# vende um controle que o produto deliberadamente não tem.
svc.hosts.quota.title:
  pt: "Cota por máquina"
  en: "Per-machine data cap"
svc.hosts.quota.subtitle:
  pt: "Quanto cada máquina já consumiu no ciclo, e aviso antes de passar do teto declarado."
  en: "How much each machine has used in the current cycle, with a warning before it passes the declared cap."
svc.hosts.quota.help.title:
  pt: "De onde vem este número"
  en: "Where this number comes from"
svc.hosts.quota.help1:
  pt: "O consumo é"
  en: "Usage is"
svc.hosts.quota.helpMeasuredTerm:
  pt: "medido pelo firewall, só IPv4"
  en: "measured by the firewall, IPv4 only"
svc.hosts.quota.help2:
  pt: ", a partir dos contadores por endereço do nftables — os mesmos que desenham os gráficos por máquina. Ela conta TUDO o que o firewall encaminha, inclusive de uma sub-rede para outra e de ou para a VPN, e o tráfego IPv6 NÃO entra. GB aqui é 10⁹."
  en: ", from the nftables per-address counters — the same ones that draw the per-machine charts. It counts EVERYTHING the firewall forwards, including traffic between subnets and to or from the VPN, and IPv6 traffic is NOT counted. GB means 10⁹."
svc.hosts.quota.warnNoEnforcement:
  pt: "Isto avisa: não corta a máquina nem limita a banda dela."
  en: "This warns only: it does not cut the machine off, nor limit its bandwidth."
svc.hosts.quota.warnWhereItStops:
  pt: "O aviso pára no painel. Para ele sair por Telegram, WhatsApp, e-mail ou webhook, ligue \"deixar os alertas que nomeiam uma máquina saírem da caixa\" em Configurações › Notificações."
  en: "The warning stops on the dashboard. To let it go out over Telegram, WhatsApp, e-mail or webhook, turn on \"let alerts that name a machine leave the box\" under Settings › Notifications."
svc.hosts.quota.noMeasure:
  pt: "sem medição neste ciclo"
  en: "no measurement this cycle"
svc.hosts.quota.noMeasureHint:
  pt: "A cota está declarada e nada foi medido para esta máquina no ciclo vigente. Pode ser uma máquina parada, desligada ou já destruída."
  en: "The cap is set and nothing has been measured for this machine in the current cycle. It may be idle, stopped or already terminated."
svc.hosts.quota.periodChangeWarning:
  pt: "Trocar o período ou o dia de fechamento redefine o ciclo: o consumo já medido é levado para o ciclo novo e os alertas abertos desta máquina são fechados."
  en: "Changing the period or the cycle day redefines the cycle: usage measured so far is carried into the new cycle and this machine's open alerts are closed."
